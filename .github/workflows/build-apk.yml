name: Build APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.1.12297006" "platforms;android-34"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install deps
        env:
          CI: false
        run: pnpm install --no-frozen-lockfile

      - name: Build APK
        env:
          NODE_ENV: production
          EXPO_NO_DOTENV: 1
          GRADLE_OPTS: -Xmx6g -Dorg.gradle.jvmargs="-Xmx6g"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx6g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-chat-apk
          path: android/app/build/outputs/apk/debug/*.apk
